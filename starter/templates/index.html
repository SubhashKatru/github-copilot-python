<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku Game</title>
  <script>
    // Apply the saved theme before first paint to avoid a light/dark flash.
    try {
      const savedTheme = localStorage.getItem('sudokuTheme');
      if (savedTheme === 'dark' || savedTheme === 'light') {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
    } catch (error) { /* storage unavailable: fall back to OS preference */ }
  </script>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>
  <div id="sudoku-board"></div>
  <div class="controls">
    <button id="new-game">New Game</button>
    <button id="get-hint">Hint</button>
    <button id="check-solution">Check Solution</button>
    <button id="theme-toggle" type="button" aria-pressed="false">Dark mode</button>
    <label for="difficulty">Difficulty</label>
    <select id="difficulty" name="difficulty">
      <option value="Easy">Easy</option>
      <option value="Medium" selected>Medium</option>
      <option value="Hard">Hard</option>
    </select>
    <span id="hint-count">Hints used: 0</span>
    <span id="timer" aria-live="off">Time: <span id="elapsed-time">00:00</span></span>
    <span id="message"></span>
  </div>
  <section id="leaderboard" aria-labelledby="leaderboard-title">
    <div class="leaderboard-heading">
      <h2 id="leaderboard-title">Top 10 Fastest Times</h2>
      <button id="clear-scores" type="button">Clear Scores</button>
    </div>
    <p id="leaderboard-message" role="status"></p>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th scope="col">Rank</th>
            <th scope="col">Player</th>
            <th scope="col">Time</th>
            <th scope="col">Difficulty</th>
            <th scope="col">Hints</th>
          </tr>
        </thead>
        <tbody id="leaderboard-scores"></tbody>
      </table>
    </div>
  </section>
  <dialog id="score-dialog" aria-labelledby="score-dialog-title">
    <form id="score-form">
      <h2 id="score-dialog-title">Puzzle complete!</h2>
      <p>Your time: <strong id="completion-time">00:00</strong> | Hints used: <strong id="completion-hints">0</strong></p>
      <label for="player-name">Player name</label>
      <input id="player-name" name="player-name" type="text" maxlength="30" required autocomplete="name">
      <div class="dialog-actions">
        <button type="submit">Save Score</button>
      </div>
    </form>
  </dialog>
  <script src="/static/main.js"></script>
</body>
</html>
